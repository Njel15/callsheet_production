<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Desk — Call Sheets</title><style>
:root{--sky:#dff2ff;--blue:#4589b7;--ink:#253b4b;--muted:#718596;--line:#dce6ed;--bg:#f4f7f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Arial}.shell{max-width:1180px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{font-weight:850;font-size:22px;letter-spacing:-.8px}.brand span{color:var(--blue)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--blue)}h1{font-size:35px;letter-spacing:-1.4px;margin:4px 0 6px}h2{font-size:17px;margin:0 0 15px}p{color:var(--muted);margin:0}.hero{padding:30px;border:1px solid #c9e4f5;border-radius:22px;background:linear-gradient(115deg,#e0f3ff,#fff 72%);display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 15px;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#4589b7;color:white;border-color:#4589b7}.btn.danger{color:#b74c54}.btn.small{padding:6px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #243f5010}.event{padding:12px;border-radius:11px;cursor:pointer;border:1px solid transparent;margin:5px 0}.event.active{background:#eaf6ff;border-color:#c5e5fa}.event strong{display:block}.event small{color:var(--muted)}label{font-size:12px;font-weight:750;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #d8e2e9;border-radius:9px;font:inherit;color:var(--ink);background:#fff}textarea{resize:vertical;min-height:65px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-head h2{margin:0}.item{display:flex;gap:10px;align-items:center;margin:8px 0}.item input[type=checkbox]{width:17px;height:17px;accent-color:#4589b7;flex-shrink:0}.item input[type=text]{flex:1}.item .qty{width:65px}.item .owner{width:125px}.muted{color:var(--muted);font-size:12px}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px}.empty{padding:18px;color:var(--muted);background:#f6f9fb;border-radius:10px}.print-only{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{display:block}.hero .actions{margin-top:18px}.fields{grid-template-columns:1fr}.shell{padding:18px 12px}h1{font-size:28px}.item{flex-wrap:wrap}.item .owner{width:105px}}@page{size:A4;margin:13mm}@media print{body{background:white;font-size:11px}.shell{padding:0;max-width:none}header,.hero,.sidebar,.no-print,.btn{display:none!important}.layout{display:block}.panel{box-shadow:none;border:1px solid #d6e1e8;border-radius:7px;padding:12px;margin-bottom:10px;break-inside:avoid}.fields{grid-template-columns:1fr 1fr;gap:9px}.fields label{font-size:10px}.fields input,.fields textarea{padding:3px 0;border:0;border-radius:0;min-height:0;background:transparent;font-size:11px;resize:none}.item{break-inside:avoid;margin:4px 0}.item input[type=text]{border:0;padding:3px}.item input[type=checkbox]{appearance:none;width:12px;height:12px;border:1px solid #888;border-radius:2px}.item input[type=checkbox]:checked:after{content:'✓';position:relative;top:-5px}.print-only{display:block}h2{font-size:14px;margin-bottom:8px}.section-head{margin-bottom:6px}.muted{font-size:10px}}
 .hidden{display:none!important}.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}.eventcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;cursor:pointer;text-align:left;transition:.2s;min-height:190px}.eventcard:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 10px 25px #294c6512}.eventcard h2{font-size:20px;margin:15px 0 8px}.pill{display:inline-block;border-radius:30px;background:#e3f3ff;color:#3477a3;padding:5px 10px;font-size:11px;font-weight:800}.detail{max-width:920px;margin:auto}.detailtop{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.previewgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.previewgrid div{background:#f6f9fb;padding:14px;border-radius:10px}.previewgrid small{display:block;color:var(--muted)}.checkrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.checkrow input{width:18px;height:18px;accent-color:var(--blue)}.checkrow.done span{text-decoration:line-through;color:var(--muted)}@media(max-width:650px){.previewgrid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.shell{padding:18px 14px}}@media print{header,.hero,.no-print,#home,#formview{display:none!important}#detail{display:block!important}.shell{padding:0}.panel{box-shadow:none;break-inside:avoid}}</style></head><body><div class="shell"><header><div class="brand">☁ PRODUCTION<span>DESK</span></div><div class="muted">CALL SHEET / PRODUCTION PLANNER</div></header><section class="hero no-print"><div><div class="eyebrow">PRODUCTION WORKSPACE</div><h1 id="heroTitle">Your productions.</h1><p id="heroSub">All your upcoming and ongoing productions in one place.</p></div><button class="btn primary" onclick="addEvent()">＋ Add New Event</button></section><section id="home"><div class="section-head"><h2>Production events</h2><span class="muted" id="eventCount"></span></div><div id="cards" class="homegrid"></div><div class="panel" style="margin-top:20px"><p>Saved automatically in this browser. Back up your events to move between devices.</p><div class="footer"><button class="btn small" onclick="exportData()">Export backup</button><button class="btn small" onclick="document.getElementById('importer').click()">Import backup</button><input hidden id="importer" type="file" accept="application/json" onchange="importData(event)"></div></div></section><section id="detail" class="detail hidden"></section><section id="formview" class="detail hidden"><div class="detailtop"><button class="btn" onclick="goHome()">← All events</button><span class="eyebrow">EVENT EDITOR</span></div><main id="editor"></main></section></div><script>
const KEY='production-desk-v1';const uid=()=>Math.random().toString(36).slice(2,10);const initial=()=>({id:uid(),title:'ESYR Product Shoot',date:'',call:'10:30',wrap:'',location:'Rumah Kelly',address:'',map:'https://share.google/4cWupYyZYaUFemmxx',contact:'',notes:'All crew standby at Rumah Kelly.',crew:[{id:uid(),name:'All crew',role:'Crew',time:'10:30'}],gear:[...['IMPODIO Background polos / alas (Putih, 200×130 cm)','IMPODIO Acrylic Water Drop Pro (D-2 cm)','IMPODIO Water Tray Table-Photo (40×40 cm)','IMPODIO Aksesoris akrilik 2mm (Bulat 8cm)','IMPODIO alas turn table 30cm','Cermin ESYR','Kotak Akrilik (Aquarium)','Lighting','Tripod','Mic','Aloe Vera','Neostrata Product','SD Card Njel'].map((name,i)=>({id:uid(),name,qty:i===3||i===7?2:1,owner:'ESYR',checked:false})),...['BSM Lighting Set','Lens 90mm','Camera A7C II','Camera Batteries','Palette Knife','Turn table','Backup Mic','RGB Lighting VL119'].map((name,i)=>({id:uid(),name,qty:i===3?4:i===4?2:1,owner:'Njel',checked:false}))]});let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data?.events?.length)data={events:[initial()],selected:null};data.selected=data.selected||data.events[0].id;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const current=()=>data.events.find(e=>e.id===data.selected)||data.events[0];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function update(k,v){current()[k]=v;save();if(k==='title'||k==='date')renderEvents()}function renderEvents(){renderHome()}function selectEvent(id){data.selected=id;save();showDetail()}function addEvent(){let e={...initial(),id:uid(),title:'Untitled production',location:'',map:'',notes:'',gear:[],crew:[]};data.events.unshift(e);data.selected=e.id;save();render();showForm()}function duplicateEvent(){let e=JSON.parse(JSON.stringify(current()));e.id=uid();e.title+=' (Copy)';e.crew.forEach(x=>x.id=uid());e.gear.forEach(x=>x.id=uid());data.events.unshift(e);data.selected=e.id;save();render();showForm()}function deleteEvent(){if(!confirm('Delete this production?'))return;data.events=data.events.filter(e=>e.id!==data.selected);if(!data.events.length)data.events=[initial()];data.selected=data.events[0].id;save();render();goHome()}function field(label,k,type='text',full=false){let v=esc(current()[k]);return `<div class="${full?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea oninput="update('${k}',this.value)">${v}</textarea>`:`<input type="${type}" value="${v}" oninput="update('${k}',this.value)">`}</div>`}function addCrew(){current().crew.push({id:uid(),name:'',role:'',time:current().call});save();renderEditor()}function addGear(){current().gear.push({id:uid(),name:'',qty:1,owner:'',checked:false});save();renderEditor()}function rowUpdate(kind,id,key,val){let row=current()[kind].find(x=>x.id===id);row[key]=val;save();if(key==='checked')renderProgress()}function removeRow(kind,id){current()[kind]=current()[kind].filter(x=>x.id!==id);save();renderEditor()}function renderProgress(){let g=current().gear;document.getElementById('progress').textContent=`${g.filter(x=>x.checked).length} / ${g.length} packed`}
function renderEditor(){let e=current();document.getElementById('editor').innerHTML=`<div class="panel"><div class="section-head"><div><div class="eyebrow">Production details</div><h2 style="margin:3px 0">Call Sheet</h2></div><div class="actions no-print"><button class="btn small" onclick="showDetail()">Preview</button><button class="btn small" onclick="duplicateEvent()">Duplicate</button><button class="btn small danger" onclick="deleteEvent()">Delete</button></div></div><div class="fields">${field('Production / Event name','title','text',true)}${field('Shoot date','date','date')}${field('General crew call','call','time')}${field('Estimated wrap','wrap','time')}${field('Location / Venue','location')}${field('Full address','address','text',true)}${field('Google Maps / Location URL','map','url',true)}${field('Contact / PIC','contact')}${field('Notes / Instructions','notes','textarea',true)}</div><div class="footer no-print"><button class="btn" onclick="openMap()">↗ Open location</button><button class="btn" onclick="calendar()">＋ Add to Calendar</button><button class="btn primary" onclick="window.print()">Print / Save A4 PDF</button></div></div><div class="panel"><div class="section-head"><h2>Crew call</h2><button class="btn small no-print" onclick="addCrew()">＋ Add crew</button></div>${e.crew.length?e.crew.map(x=>`<div class="item"><input aria-label="Crew name" placeholder="Crew name" value="${esc(x.name)}" oninput="rowUpdate('crew','${x.id}','name',this.value)"><input aria-label="Role" placeholder="Role" value="${esc(x.role)}" oninput="rowUpdate('crew','${x.id}','role',this.value)"><input aria-label="Call time" type="time" style="width:110px" value="${esc(x.time)}" oninput="rowUpdate('crew','${x.id}','time',this.value)"><button class="btn small danger no-print" onclick="removeRow('crew','${x.id}')">×</button></div>`).join(''):'<div class="empty">No crew added yet.</div>'}</div><div class="panel"><div class="section-head"><div><h2>Equipment & Props Checklist</h2><div class="muted" id="progress"></div></div><button class="btn small no-print" onclick="addGear()">＋ Add item</button></div>${e.gear.length?e.gear.map(x=>`<div class="item"><input type="checkbox" aria-label="Packed" ${x.checked?'checked':''} onchange="rowUpdate('gear','${x.id}','checked',this.checked)"><input type="text" aria-label="Item" placeholder="Item / equipment" value="${esc(x.name)}" oninput="rowUpdate('gear','${x.id}','name',this.value)"><input class="qty" type="number" min="1" aria-label="Quantity" value="${esc(x.qty)}" oninput="rowUpdate('gear','${x.id}','qty',this.value)"><input class="owner" type="text" aria-label="Provided by" placeholder="From / Owner" value="${esc(x.owner)}" oninput="rowUpdate('gear','${x.id}','owner',this.value)"><button class="btn small danger no-print" onclick="removeRow('gear','${x.id}')">×</button></div>`).join(''):'<div class="empty">No equipment added. Start your packing list.</div>'}<div class="footer"><span class="muted">Tick items as you pack. Changes save automatically.</span><span class="muted print-only">Prepared by: __________________ &nbsp; Checked by: __________________</span></div></div>`;renderProgress()}
function renderHome(){document.getElementById('eventCount').textContent=data.events.length+' events';let today=new Date().toLocaleDateString('en-CA');document.getElementById('cards').innerHTML=data.events.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(e=>{let status=!e.date?'DATE TBD':e.date<today?'PAST EVENT':e.date===today?'ONGOING':'UPCOMING';return `<button class="eventcard" onclick="selectEvent('${e.id}')"><span class="pill">${status}</span><h2>${esc(e.title||'Untitled production')}</h2><p>◷ ${esc(e.date||'Date TBD')} · ${esc(e.call||'Time TBD')}</p><p>⌖ ${esc(e.location||'Location TBD')}</p><div class="footer"><span class="muted">${e.gear.filter(x=>x.checked).length}/${e.gear.length} items packed</span><strong style="color:var(--blue)">View →</strong></div></button>`}).join('')}function view(name){for(let id of ['home','detail','formview'])document.getElementById(id).classList.toggle('hidden',id!==name);document.getElementById('heroTitle').textContent=name==='home'?'Your productions.':name==='detail'?'Production overview.':'Event setup.';window.scrollTo(0,0)}function goHome(){renderHome();view('home')}function showForm(){renderEditor();view('formview')}function showDetail(){let e=current();let owners=[...new Set(e.gear.map(x=>x.owner||'Unassigned'))];document.getElementById('detail').innerHTML=`<div class="detailtop no-print"><button class="btn" onclick="goHome()">← All events</button><div class="actions"><button class="btn" onclick="showForm()">✎ Edit event</button><button class="btn" onclick="calendar()">＋ Add to Calendar</button><button class="btn" onclick="window.print()">Print / PDF</button></div></div><div class="panel"><div class="eyebrow">PRODUCTION CALL SHEET</div><h1>${esc(e.title)}</h1><p>${esc(e.notes||'')}</p><div class="previewgrid" style="margin-top:22px"><div><small>SHOOT DATE</small><strong>${esc(e.date||'TBD')}</strong></div><div><small>GENERAL CREW CALL</small><strong>${esc(e.call||'TBD')}</strong></div><div><small>ESTIMATED WRAP</small><strong>${esc(e.wrap||'TBD')}</strong></div><div><small>CONTACT / PIC</small><strong>${esc(e.contact||'—')}</strong></div><div style="grid-column:1/-1"><small>LOCATION</small><strong>${esc(e.location||'TBD')}</strong><p>${esc(e.address||'')}</p><button class="btn small no-print" style="margin-top:10px" onclick="openMap()">↗ Open Maps</button></div></div></div><div class="panel"><div class="section-head"><h2>Crew call</h2><span class="muted">${e.crew.length} crew</span></div>${e.crew.length?e.crew.map(c=>`<div class="checkrow"><strong style="min-width:65px">${esc(c.time||e.call)}</strong><span>${esc(c.name||'Unnamed')} · ${esc(c.role||'Crew')}</span></div>`).join(''):'<p>No crew added yet.</p>'}</div><div class="panel"><div class="section-head"><div><h2>Equipment & props</h2><p id="detailprogress"></p></div><button class="btn small no-print" onclick="showForm()">＋ Edit list</button></div>${owners.map(o=>`<h3 style="margin:20px 0 6px">From ${esc(o)}</h3>${e.gear.filter(g=>(g.owner||'Unassigned')===o).map(g=>`<label class="checkrow ${g.checked?'done':''}"><input type="checkbox" ${g.checked?'checked':''} onchange="previewCheck('${g.id}',this.checked)"><span style="flex:1">${esc(g.name)}</span><strong>×${esc(g.qty)}</strong></label>`).join('')}`).join('')||'<p>No items added yet.</p>'}</div>`;let p=document.getElementById('detailprogress');p.textContent=e.gear.filter(x=>x.checked).length+' / '+e.gear.length+' packed';view('detail')}function previewCheck(id,v){current().gear.find(x=>x.id===id).checked=v;save();showDetail()}function render(){renderHome();renderEditor()}function openMap(){let v=current().map;if(v&&/^https?:\/\//i.test(v))window.open(v,'_blank','noopener,noreferrer');else if(current().address||current().location)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(current().address||current().location),'_blank','noopener,noreferrer');else alert('Add a location first.')}function calendar(){let e=current();if(!e.date){alert('Set the shoot date first.');return}let start=e.date.replaceAll('-','')+'T'+(e.call||'09:00').replace(':','')+'00';let end=e.date.replaceAll('-','')+'T'+(e.wrap&&e.wrap>e.call?e.wrap:'23:00').replace(':','')+'00';let u='https://calendar.google.com/calendar/render?action=TEMPLATE&'+new URLSearchParams({text:e.title,dates:start+'/'+end,details:[e.notes,'Crew call: '+e.call,e.map].filter(Boolean).join('\n'),location:e.address||e.location}).toString();window.open(u,'_blank','noopener,noreferrer')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='production-desk-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(ev){let f=ev.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events)||!d.events.length)throw Error('Invalid backup');if(!confirm('Replace current productions with this backup?'))return;data=d;data.selected=data.events[0].id;save();render()}catch(err){alert('Could not import backup: '+err.message)}ev.target.value=''}render();goHome();
</script></body></html>
